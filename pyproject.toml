[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poniard"
version = "0.5.0"
description = "Streamline scikit-learn model comparison"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Rafael Xavier", email = "rxaviermontero@gmail.com" },
]
keywords = ["machine learning", "scikit-learn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "joblib",
    "tqdm",
]

[project.optional-dependencies]
plot = ["plotly"]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "poniard[plot]",
]

[project.urls]
Homepage = "https://github.com/rxavier/poniard"
Repository = "https://github.com/rxavier/poniard"

[tool.setuptools.packages.find]
include = ["poniard*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
per-file-ignores = {"poniard/**/__init__.py" = ["F401"]}

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.16.0",
    "pre-commit",
    "poniard[plot]",
]
